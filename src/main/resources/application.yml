spring:
  application:
    name: shagriha-backend-services
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/shagriha_dev}
    username: ${DATABASE_USERNAME:orbitekk}
    password: ${DATABASE_PASSWORD:Test123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:shagriha-api}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mapbox:
  access-token: ${MAPBOX_ACCESS_TOKEN:}
  nearby-cache-ttl: ${MAPBOX_NEARBY_CACHE_TTL:P7D}
